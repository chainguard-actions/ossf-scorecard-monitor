name: Test deps.dev report-tool option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create scope file with empty included list
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-data"
          cat > "$GITHUB_WORKSPACE/test-data/scope.json" <<'EOF'
          {
            "github.com": {
              "test-org": {
                "included": [],
                "excluded": []
              }
            }
          }
          EOF

      - name: Create empty database file
        run: |
          cat > "$GITHUB_WORKSPACE/test-data/database.json" <<'EOF'
          {
            "github.com": {}
          }
          EOF

      - id: action
        uses: .
        with:
          scope: test-data/scope.json
          database: test-data/database.json
          report: test-data/report.md
          github-token: ${{ github.token }}
          report-tool: "deps.dev"
          auto-commit: "false"
          auto-push: "false"
          generate-issue: "false"

      - name: Assert action completed successfully with deps.dev tool
        run: |
          echo "PASS: action completed with deps.dev report-tool"
