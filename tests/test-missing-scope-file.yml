name: Test missing scope file causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure scope file does not exist
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-data"
          rm -f "$GITHUB_WORKSPACE/test-data/nonexistent-scope.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          scope: test-data/nonexistent-scope.json
          database: test-data/database.json
          report: test-data/report.md
          github-token: ${{ github.token }}
          auto-commit: "false"
          auto-push: "false"
          generate-issue: "false"
          discovery-enabled: "false"

      - name: Assert action failed due to missing scope file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when scope file is missing and discovery is disabled, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with missing scope file"
