name: Test report tags feature with empty scope
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create scope file with empty included list
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-data"
          cat > "$GITHUB_WORKSPACE/test-data/scope.json" <<'EOF'
          {
            "github.com": {
              "test-org": {
                "included": [],
                "excluded": []
              }
            }
          }
          EOF

      - name: Create empty database file
        run: |
          cat > "$GITHUB_WORKSPACE/test-data/database.json" <<'EOF'
          {
            "github.com": {}
          }
          EOF

      - name: Create existing report file with tags
        run: |
          cat > "$GITHUB_WORKSPACE/test-data/report.md" <<'EOF'
          # My Security Report

          Some existing content before the scorecard section.

          <!-- OPENSSF-SCORECARD-MONITOR:START -->
          Old scorecard content here
          <!-- OPENSSF-SCORECARD-MONITOR:END -->

          Some existing content after the scorecard section.
          EOF

      - id: action
        uses: .
        with:
          scope: test-data/scope.json
          database: test-data/database.json
          report: test-data/report.md
          github-token: ${{ github.token }}
          auto-commit: "false"
          auto-push: "false"
          generate-issue: "false"
          report-tags-enabled: "true"
          report-start-tag: "<!-- OPENSSF-SCORECARD-MONITOR:START -->"
          report-end-tag: "<!-- OPENSSF-SCORECARD-MONITOR:END -->"

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed with report-tags-enabled"
