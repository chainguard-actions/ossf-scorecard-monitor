name: Test invalid report-tool input causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create scope file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-data"
          cat > "$GITHUB_WORKSPACE/test-data/scope.json" <<'EOF'
          {
            "github.com": {
              "test-org": {
                "included": [],
                "excluded": []
              }
            }
          }
          EOF

      - name: Create empty database file
        run: |
          cat > "$GITHUB_WORKSPACE/test-data/database.json" <<'EOF'
          {
            "github.com": {}
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          scope: test-data/scope.json
          database: test-data/database.json
          report: test-data/report.md
          github-token: ${{ github.token }}
          report-tool: "invalid-tool"
          auto-commit: "false"
          auto-push: "false"
          generate-issue: "false"

      - name: Assert action failed due to invalid report-tool
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid report-tool, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid report-tool"
